# This rule is not used by the project wavefront-controller itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over wavefront.as-code.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: wavefront-controller
    app.kubernetes.io/managed-by: kustomize
  name: wavefront-admin-role
rules:
- apiGroups:
  - wavefront.as-code.io
  resources:
  - wavefronts
  verbs:
  - '*'
- apiGroups:
  - wavefront.as-code.io
  resources:
  - wavefronts/status
  verbs:
  - get
