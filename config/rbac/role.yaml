---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - kustomize.toolkit.fluxcd.io
  resources:
  - kustomizations
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - source.toolkit.fluxcd.io
  resources:
  - gitrepositories
  verbs:
  - get
  - list
  - patch
  - watch
- apiGroups:
  - wavefront.as-code.io
  resources:
  - wavefronts
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - wavefront.as-code.io
  resources:
  - wavefronts/status
  verbs:
  - get
  - patch
  - update
