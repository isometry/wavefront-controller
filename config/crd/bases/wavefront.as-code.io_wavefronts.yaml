                      required:
                      - kind
                      - name
                      - namespace
                      type: object
                    reason:
                      description: |-
                        Reason distinguishes how the source is held: a foreign field manager
                        owning spec.ref.commit (HandPin) or spec.suspend (Suspend).
                      enum:
