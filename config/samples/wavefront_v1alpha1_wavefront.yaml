apiVersion: wavefront.as-code.io/v1alpha1
kind: Wavefront
metadata:
  name: fleet
  labels:
    app.kubernetes.io/name: wavefront-controller
    app.kubernetes.io/managed-by: kustomize
spec:
  nodes:
    kinds: [Kustomization]           # v1: only Kustomization; HelmRelease is reserved for a future, non-breaking addition
    selector:
      matchLabels:
        wavefront.as-code.io/managed: "true"   # the participation label marking a node/source as controller-managed
  mode: Shadow                       # start in Shadow: detect, derive, report — zero writes.
                                      # Flip to Enforce once the data gathered from a period running in Shadow mode looks right (see docs/runbook.md).
  suspend: false
  poll:
    interval: 90s
    perHostConcurrency: 4
