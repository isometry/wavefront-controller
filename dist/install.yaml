                        properties:
                          kind:
                            enum:
                            - Kustomization
                            type: string
                          name:
                            type: string
                          namespace:
                            type: string
                        required:
                        - kind
                        - name
                        - namespace
                        type: object
                      type: array
                      x-kubernetes-list-type: atomic
                    held:
                      type: boolean
                    node:
                      description: |-
                        NodeReference identifies a graph node. Typed {kind, namespace, name} from
                        day one so HelmRelease nodes are a non-breaking addition (DESIGN D12).
                      properties:
                        kind:
                          enum:
                          - Kustomization
                          type: string
                        name:
                          type: string
                        namespace:
                          type: string
                      required:
                      - kind
                      - name
                      - namespace
                      type: object
                    observedSHA:
                      type: string
                    pendingSince:
                      format: date-time
                      type: string
                    pin:
                      type: string
                    ready:
                      type: boolean
                    role:
                      enum:
                      - Pinned
                      - Gate
                      type: string
                    source:
                      type: string
                    state:
                      enum:
                      - Settled
                      - Pending
                      - Admissible
                      - Converging
                      - Unhealthy
                      type: string
                  required:
                  - node
                  - ready
                  - role
                  - state
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              membersOmitted:
