          status:
            description: status defines the observed state of Wavefront
            properties:
              blocked:
                description: |-
                  Blocked and Held are capped exceptional-state lists (see StatusListCap);
                  the counts in Nodes are authoritative.
                items:
                  properties:
                    ancestor:
                      description: |-
                        NodeReference identifies a graph node. Typed {kind, namespace, name} from
                        day one so HelmRelease nodes are a non-breaking addition (DESIGN D12).
                      properties:
                        kind:
                          enum:
                          - Kustomization
                          type: string
                        name:
                          type: string
                        namespace:
                          type: string
                      required:
                      - kind
                      - name
                      - namespace
                      type: object
                    node:
                      description: |-
                        NodeReference identifies a graph node. Typed {kind, namespace, name} from
                        day one so HelmRelease nodes are a non-breaking addition (DESIGN D12).
                      properties:
                        kind:
                          enum:
                          - Kustomization
                          type: string
                        name:
                          type: string
                        namespace:
                          type: string
                      required:
                      - kind
                      - name
                      - namespace
                      type: object
                    reason:
                      type: string
                    since:
                      format: date-time
                      type: string
